spring.application.name=file-transfer-server

# TCP listen port
fileserver.port=9999

# Comma-separated list of storage roots, tried in order
fileserver.storage.path=/data/storage-a,/data/storage-b

# Worker thread pool size (concurrent clients)
fileserver.thread.pool.size=10

# Whether FDEL actually deletes the file (false = dry-run, logs only)
fileserver.delete.enabled=false

logging.level.root=WARN
logging.level.com.example.filetransfer=INFO

spring.main.web-application-type=none
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
